services:
  app:
    image: eai-robot-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eai-robot-app
    env_file:
      - rag_server/.env
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
